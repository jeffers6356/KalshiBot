<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kalshi Smart Money</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#17191c}
    header{padding:28px 32px;background:#111827;color:white}
    main{max-width:1200px;margin:24px auto;padding:0 20px}
    .actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
    button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}
    .primary{background:#111827;color:white}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:18px}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:14px}
    .muted{color:#6b7280}.signal{font-weight:700}
  </style>
</head>
<body>
<header><h1>Kalshi Smart Money</h1><div>Research & alert MVP — no auto-trading</div></header>
<main>
  <div class="actions"><button class="primary" onclick="collect()">Collect Kalshi Data</button><button onclick="refresh()">Refresh</button></div>
  <div id="status" class="muted"></div>
  <div class="card"><h2>Smart-money signals</h2><div id="signals">Loading…</div></div>
  <div class="card"><h2>Watched traders</h2><div id="traders">Loading…</div></div>
  <div class="card"><h2>Recent market trades</h2><div id="trades">Loading…</div></div>
</main>
<script>
async function j(url,opts){const r=await fetch(url,opts);return r.json()}
async function collect(){document.getElementById('status').textContent='Collecting…';const x=await j('/api/collect',{method:'POST'});document.getElementById('status').textContent=`Collected ${x.markets} markets and ${x.trades} trades.`;refresh()}
async function refresh(){
 const [s,t,tr]=await Promise.all([j('/api/signals'),j('/api/traders'),j('/api/trades?limit=30')]);
 document.getElementById('signals').innerHTML=s.length?s.map(x=>`<div class="card"><span class="signal">${x.consensus} — ${(x.confidence*100).toFixed(0)}%</span><br><span class="muted">${x.market_ticker} · YES: ${x.yes_traders.join(', ')||'—'} · NO: ${x.no_traders.join(', ')||'—'}</span></div>`).join(''):'No consensus signals yet.';
 document.getElementById('traders').innerHTML=t.length?`<table><tr><th>Trader</th><th>Score</th><th>ROI</th><th>Profit</th><th>Win rate</th></tr>${t.map(x=>`<tr><td>${x.username}</td><td>${x.score.toFixed(1)}</td><td>${(x.roi*100).toFixed(1)}%</td><td>$${x.profit.toLocaleString()}</td><td>${(x.win_rate*100).toFixed(1)}%</td></tr>`).join('')}</table>`:'No traders on the watchlist.';
 document.getElementById('trades').innerHTML=tr.length?`<table><tr><th>Time</th><th>Market</th><th>Side</th><th>Price</th><th>Contracts</th></tr>${tr.map(x=>`<tr><td>${x.created_time}</td><td>${x.ticker}</td><td>${x.side}</td><td>${(x.yes_price*100).toFixed(1)}¢</td><td>${x.count}</td></tr>`).join('')}</table>`:'No trades collected.';
}
refresh();
</script>
</body>
</html>
